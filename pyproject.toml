[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ugar-pipeline"
version = "1.0.0"
description = "КОНВЕЙЕР УГАР — производственный конвейер главы книжной серии (ТЗ v1.0)"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9",
    "pydantic>=2.5",
    "Jinja2>=3.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
llm = ["google-genai>=1.0", "anthropic>=0.40"]
dev = ["pytest>=7.4"]

[project.scripts]
ugar = "ugar.cli:app"

[tool.setuptools]
packages = ["ugar"]

[tool.setuptools.package-data]
ugar = ["data/**/*", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
